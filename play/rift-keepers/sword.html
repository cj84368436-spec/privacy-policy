<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111b21"><title>균열의 수호자 · 스킬 연출</title><style>*{box-sizing:border-box}body{margin:0;background:#10191e;color:#eadfc3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:430px;margin:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}h1{font-size:23px;margin:0 0 8px}p{font-size:13px;color:#aeb7b7;line-height:1.65}.stage{border:1px solid #a8905b;border-radius:12px;overflow:hidden;background:#0b1115}video{display:block;width:100%;max-height:62svh;object-fit:contain}button,a{padding:14px;border-radius:8px;text-align:center;font:700 14px -apple-system,sans-serif;text-decoration:none;cursor:pointer}#play,a{display:block;width:100%;margin-top:12px}#play,.primary{background:#dfbd74;color:#17211e;border:1px solid #f1d38d}.secondary{background:#1c2b30;color:#ddd0ad;border:1px solid #a8905b55}.heroes{display:flex;gap:7px;margin:16px 0 12px}.heroes button{flex:1;background:#1b2a30;color:#b6c0bd;border:1px solid #60706e55}.heroes button[aria-pressed=true]{border-color:#c8a869;color:#f1dbab;background:#2b3130}small{color:#98aaa8}</style></head><body><main><h1 id="title">천검 · 진화 연출</h1><p>새 원화와 효과음을 적용한 실제 게임 화면입니다.<br>연출 확인을 위해 적의 체력을 높인 약 13초 영상이에요.</p><div class="heroes"><button data-class="knight" aria-pressed="true">천검</button><button data-class="ranger" aria-pressed="false">성좌의 노궁</button><button data-class="mage" aria-pressed="false">창룡</button></div><div class="stage"><video id="reel" controls playsinline preload="metadata"><source src="video/knight.mp4?v=5.2.0" type="video/mp4"></video></div><button id="play">효과음과 함께 재생</button><a id="practice" class="primary" href="./?v=5.2.0-painted-r1&amp;practice=thousand&amp;tier=5&amp;evolved=1">직접 천검 연습하기</a><a class="secondary" href="./?v=5.2.0-painted-r1">생존 도전하기</a><p><small>연습 모드는 점수와 보석을 변경하지 않아요.</small></p></main><script>const skills={knight:["thousand","천검"],ranger:["ballista","성좌의 노궁"],mage:["dragon","창룡"]},v=document.getElementById("reel");document.getElementById("play").onclick=()=>{v.muted=false;v.play().catch(()=>{});};for(const button of document.querySelectorAll("[data-class]"))button.onclick=()=>{v.pause();const hero=button.dataset.class,[key,label]=skills[hero];for(const b of document.querySelectorAll("[data-class]"))b.setAttribute("aria-pressed",String(b===button));document.getElementById("title").textContent=label+" · 진화 연출";document.getElementById("practice").textContent="직접 "+label+" 연습하기";document.getElementById("practice").href="./?v=5.2.0-painted-r1&practice="+key+"&tier=5&evolved=1";v.querySelector("source").src="video/"+hero+".mp4?v=5.2.0";v.load();};</script></body></html>

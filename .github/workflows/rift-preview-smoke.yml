name: Verify playable Rift Keepers preview
on:
  push:
    paths:
      - 'play/rift-keepers/**'
      - '.github/workflows/rift-preview-smoke.yml'
permissions:
  contents: read
jobs:
  playable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright@1.55.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Open actual hosted game and exercise controls
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          import {chromium,webkit} from "playwright";
          fs.mkdirSync("preview-evidence",{recursive:true});
          for (const [name,engine] of [["chromium",chromium],["webkit",webkit]]) {
            const browser=await engine.launch();
            try {
              const page=await browser.newPage({viewport:{width:390,height:844},hasTouch:true,deviceScaleFactor:2});
              const errors=[];page.on("pageerror",e=>errors.push(e.message));
              let current=false;for(let attempt=0;attempt<20;attempt++){await page.goto("https://cj84368436-spec.github.io/privacy-policy/play/rift-keepers/?v="+process.env.GITHUB_SHA,{waitUntil:"networkidle"});current=await page.evaluate(()=>typeof Art!=="undefined"&&Art.version==="1.2.0");if(current)break;await page.waitForTimeout(3000);}assert.ok(current,"New preview did not finish publishing");
              await page.locator("#home:not(.hidden)").waitFor({timeout:20000});
              assert.equal(await page.evaluate(()=>Art.ready&&Art.images.size===13),true,"Painted textures did not load");
              await page.screenshot({path:"preview-evidence/"+name+"-home.png"});
              await page.locator('[data-hero="ranger"]').click();
              await page.locator("#start").click();
              await page.locator("#hud:not(.hidden)").waitFor();
              await page.waitForFunction(()=>document.getElementById("time").textContent!=="00:00",{timeout:10000});
              const before=await page.evaluate(()=>game.player.x);
              await page.mouse.move(130,430);await page.mouse.down();await page.mouse.move(220,430,{steps:4});
              await page.waitForTimeout(350);await page.mouse.up();
              assert.ok((await page.evaluate(()=>game.player.x))>before+20,"Dragging did not move the hero");
              await page.locator("#dash").click();await page.locator("#ultimate").click();
              await page.locator("#pause").click();await page.locator("#resume").waitFor();
              const t=await page.evaluate(()=>game.time);await page.waitForTimeout(200);
              assert.equal(await page.evaluate(()=>game.time),t,"Pause did not freeze combat");
              await page.screenshot({path:"preview-evidence/"+name+"-game.png"});
              await page.locator("#resume").click();
              await page.waitForFunction(previous=>game.time>previous,t,{timeout:5000});
              assert.deepEqual(errors,[],"Uncaught errors in hosted preview");
              console.log(name+": actual hosted game loads, starts, moves, uses abilities, pauses and resumes");
            } finally {await browser.close();}
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playable-preview-evidence
          path: preview-evidence/
          if-no-files-found: ignore

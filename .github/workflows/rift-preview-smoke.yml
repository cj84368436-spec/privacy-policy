name: Verify playable Rift Keepers preview
on:
  push:
    paths:
      - 'play/rift-keepers/**'
      - '.github/workflows/rift-preview-smoke.yml'
permissions:
  contents: read
jobs:
  playable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright@1.55.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Open actual hosted game and exercise controls
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          import crypto from "node:crypto";
          import {chromium,webkit} from "playwright";
          fs.mkdirSync("preview-evidence",{recursive:true});
          const mp4URL="https://cj84368436-spec.github.io/privacy-policy/play/rift-keepers/video/knight-15s.mp4?v="+process.env.GITHUB_SHA;
          const mediaResponse=await fetch(mp4URL);const mediaBytes=Buffer.from(await mediaResponse.arrayBuffer());const localBytes=fs.readFileSync("play/rift-keepers/video/knight-15s.mp4");
          console.log("Hosted MP4",JSON.stringify({status:mediaResponse.status,type:mediaResponse.headers.get("content-type"),length:mediaBytes.length,localLength:localBytes.length,identical:mediaBytes.equals(localBytes),magic:mediaBytes.subarray(0,12).toString("hex")}));
          assert.equal(mediaResponse.status,200);assert.ok(mediaBytes.equals(localBytes),"Hosted MP4 differs from release");
          const failures=[];
          for (const [name,engine] of [["chromium",chromium],["webkit",webkit]]) {
            const browser=await engine.launch();
            try {
              const page=await browser.newPage({viewport:{width:390,height:844},hasTouch:true,deviceScaleFactor:2});
              const errors=[];page.on("pageerror",e=>errors.push(e.message));
              page.on("requestfailed",r=>{if(r.url().includes("mp4"))console.log(name+" video request failed",r.url(),r.failure());});
              page.on("response",r=>{if(r.url().includes("mp4"))console.log(name+" video response",r.status(),r.url(),JSON.stringify(r.headers()));});
              let current=false;for(let attempt=0;attempt<40;attempt++){await page.goto("https://cj84368436-spec.github.io/privacy-policy/play/rift-keepers/?v="+process.env.GITHUB_SHA,{waitUntil:"networkidle"});current=await page.evaluate(()=>typeof Art!=="undefined"&&Art.version==="1.4.0");if(current)break;await page.waitForTimeout(3000);}assert.ok(current,"New preview did not finish publishing: "+JSON.stringify({errors,state:await page.evaluate(()=>({version:typeof Art!=="undefined"?Art.version:null,title:document.title,url:location.href,text:document.body.innerText.slice(0,300)}))}));
              await page.locator("#home:not(.hidden)").waitFor({timeout:20000});
              assert.equal(await page.evaluate(()=>Art.ready&&Art.images.size===29),true,"Painted textures did not load");
              assert.equal(await page.evaluate(()=>audio.buffers.size),15,"Recorded audio did not decode");
              await page.screenshot({path:"preview-evidence/"+name+"-home.png"});
              await page.locator('[data-hero="ranger"]').click();
              await page.locator("#start").click();
              await page.locator("#hud:not(.hidden)").waitFor();
              await page.waitForFunction(()=>document.getElementById("time").textContent!=="00:00",{timeout:10000});
              const before=await page.evaluate(()=>game.player.x);
              await page.mouse.move(130,430);await page.mouse.down();await page.mouse.move(220,430,{steps:4});
              await page.waitForTimeout(350);await page.mouse.up();
              assert.ok((await page.evaluate(()=>game.player.x))>before+20,"Dragging did not move the hero");
              await page.locator("#dash").click();await page.locator("#ultimate").click();
              await page.locator("#pause").click();await page.locator("#resume").waitFor();
              const t=await page.evaluate(()=>game.time);await page.waitForTimeout(200);
              assert.equal(await page.evaluate(()=>game.time),t,"Pause did not freeze combat");
              await page.screenshot({path:"preview-evidence/"+name+"-game.png"});
              await page.locator("#resume").click();
              await page.waitForFunction(previous=>game.time>previous,t,{timeout:5000});
              assert.deepEqual(errors,[],"Uncaught errors in hosted preview");
              const records=await page.evaluate(()=>localStorage.getItem("riftkeepers:play-preview:v1"));
              await page.goto("https://cj84368436-spec.github.io/privacy-policy/play/rift-keepers/?v="+process.env.GITHUB_SHA+"&practice=blade",{waitUntil:"networkidle"});await page.locator("#home:not(.hidden)").waitFor();await page.locator("#start").click();await page.waitForFunction(()=>game?.practice===true);
              await page.evaluate(()=>{for(let i=0;i<1100&&!game.result;i++)game.step(1/60);});await page.locator("#dialog-title").filter({hasText:"검술 연습 완료"}).waitFor();
              assert.equal(await page.evaluate(()=>localStorage.getItem("riftkeepers:play-preview:v1")),records,"Practice altered permanent records");assert.deepEqual(errors,[],"Uncaught practice errors");
              await page.goto("https://cj84368436-spec.github.io/privacy-policy/play/rift-keepers/sword.html?v="+process.env.GITHUB_SHA,{waitUntil:"networkidle"});await page.locator("#reel").waitFor();
              console.log(name+" video before gesture",await page.evaluate(()=>{const v=document.getElementById("reel");return {src:v.currentSrc,source:v.querySelector("source").src,ready:v.readyState,network:v.networkState,support:v.canPlayType('video/mp4; codecs="avc1.42E01E, mp4a.40.2"'),error:v.error?.code};}));
              await page.evaluate(()=>{window.videoEvents=[];const v=document.getElementById("reel");for(const type of ["loadstart","loadedmetadata","error","stalled","suspend","playing"])v.addEventListener(type,()=>window.videoEvents.push(type));const play=v.play.bind(v);v.play=()=>play().catch(e=>{window.videoPlayError={name:e.name,message:e.message};throw e;});});await page.locator("#play").click();
              await page.waitForFunction(()=>{const v=document.getElementById("reel");if(v.error)throw new Error("Video error "+v.error.code);return v.readyState>=1;},{},{timeout:25000});
              assert.ok((await page.evaluate(()=>document.getElementById("reel").duration))>14.8,"Gameplay reel has no duration");await page.waitForFunction(()=>document.getElementById("reel").currentTime>.1,{},{timeout:10000});
              console.log(name+": hosted 1.4 loads frames and audio, normal controls work, practice keeps records unchanged, and H264/AAC gameplay video plays");
            } catch(error) {
              const pages=browser.contexts().flatMap(c=>c.pages());const page=pages[pages.length-1];if(page){console.log(name+" video failure",await page.evaluate(()=>{const v=document.getElementById("reel");return v?{src:v.currentSrc,source:v.querySelector("source")?.src,ready:v.readyState,network:v.networkState,error:v.error?.code,playError:window.videoPlayError,events:window.videoEvents}:{};}));await page.screenshot({path:"preview-evidence/"+name+"-failure.png"});}
              console.log(name+" failed",error.message);failures.push(name+": "+error.message);
            } finally {await browser.close();}
          }
          assert.deepEqual(failures,[]);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playable-preview-evidence
          path: preview-evidence/
          if-no-files-found: ignore
